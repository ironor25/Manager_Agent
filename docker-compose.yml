version: '3.8'

services:
  # MySQL Database Service
  mysql:
    image: mysql:8.0
    container_name: manager_agent_mysql
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: manager_agent
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - manager_agent_network

  # PHP-FPM and Nginx Application Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: manager_agent_app
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: manager_agent
      DB_USERNAME: root
      DB_PASSWORD: ""
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database
      CACHE_STORE: database
      RUN_SEEDERS: "true"
    ports:
      - "8080:8080"
    volumes:
      - .:/var/www/html
      - ./storage/logs:/var/www/html/storage/logs
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - manager_agent_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Optional: Redis for caching and sessions (if needed)
  redis:
    image: redis:7-alpine
    container_name: manager_agent_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - manager_agent_network
    profiles:
      - with_redis

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  manager_agent_network:
    driver: bridge
